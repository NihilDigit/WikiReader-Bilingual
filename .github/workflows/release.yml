name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          current_prefix="$(TZ=Asia/Shanghai date '+%y.%-m.')"
          if [[ ! "$tag" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Release tags must use YY.M.patch, got '$tag'." >&2
            exit 1
          fi
          if [[ "$tag" != "$current_prefix"* ]]; then
            echo "Release tag '$tag' does not match current UTC+8 month prefix '$current_prefix'." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wikireader-bilingual-signing"
          echo "$NIHILDIGIT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wikireader-bilingual-signing/wikireader-bilingual-release.jks"
        env:
          NIHILDIGIT_RELEASE_KEYSTORE_BASE64: ${{ secrets.NIHILDIGIT_RELEASE_KEYSTORE_BASE64 }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Test Android app
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APKs
        run: ./gradlew assembleRelease
        env:
          NIHILDIGIT_RELEASE_STORE_FILE: ${{ runner.temp }}/wikireader-bilingual-signing/wikireader-bilingual-release.jks
          NIHILDIGIT_RELEASE_STORE_PASSWORD: ${{ secrets.NIHILDIGIT_RELEASE_STORE_PASSWORD }}
          NIHILDIGIT_RELEASE_KEY_ALIAS: ${{ secrets.NIHILDIGIT_RELEASE_KEY_ALIAS }}
          NIHILDIGIT_RELEASE_KEY_PASSWORD: ${{ secrets.NIHILDIGIT_RELEASE_KEY_PASSWORD }}

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*-release.apk; do
            abi="$(basename "$apk" -release.apk)"
            abi="${abi#app-}"
            cp "$apk" "release-artifacts/wikireader-bilingual-${GITHUB_REF_NAME}-${abi}.apk"
          done
          (
            cd release-artifacts
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated signed APK build for $GITHUB_REF_NAME. Edit this release manually before sharing."
          for attempt in 1 2 3 4 5; do
            echo "Release publish attempt $attempt"
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$GITHUB_REF_NAME" release-artifacts/* --repo "$GITHUB_REPOSITORY" --clobber; then
                exit 0
              fi
            else
              if gh release create "$GITHUB_REF_NAME" release-artifacts/* \
                --repo "$GITHUB_REPOSITORY" \
                --title "WikiReader Bilingual $GITHUB_REF_NAME" \
                --notes "$notes"; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
